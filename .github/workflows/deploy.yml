name: Auf maisonac.de veröffentlichen

# Läuft bei jeder Änderung am Arbeitszweig – und lässt sich im Reiter
# "Actions" auch von Hand auslösen.
on:
  push:
    branches: [claude/anna-blush-lashes-site-r13pxp]
  workflow_dispatch:

# Hostinger lässt nur wenige FTP-Verbindungen gleichzeitig zu. Zwei
# parallele Läufe blockieren sich gegenseitig, deshalb wird hier in
# Reihe gearbeitet.
concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pakete installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      # Der FTP-Zugang von Hostinger bricht bei verschachtelten Ordnern ab
      # und sperrt nach mehreren Versuchen ganz. Deshalb legt die Automatik
      # das fertige Ergebnis in den Zweig "deploy"; Hostinger holt es sich
      # von dort über seine eigene Git-Verbindung – ohne FTP.
      - name: Fertige Seite in den Zweig "deploy" legen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: true
          commit_message: "Fertige Seite aktualisiert"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
