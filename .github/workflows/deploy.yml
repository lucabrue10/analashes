name: Auf maisonac.de veröffentlichen

# Läuft bei jeder Änderung am Arbeitszweig – und lässt sich im Reiter
# "Actions" auch von Hand auslösen.
on:
  push:
    branches: [claude/anna-blush-lashes-site-r13pxp]
  workflow_dispatch:
    inputs:
      sauber:
        description: 'Zielordner vorher komplett leeren (ja/nein)'
        default: 'nein'
        required: false

# Hostinger lässt nur wenige FTP-Verbindungen gleichzeitig zu. Zwei
# parallele Läufe blockieren sich gegenseitig, deshalb wird hier in
# Reihe gearbeitet.
concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pakete installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      # lftp statt einer fertigen Action: Es legt verschachtelte Ordner
      # zuverlässig an, wiederholt abgebrochene Übertragungen selbst und
      # kommt mit den Eigenheiten einfacher FTP-Server zurecht.
      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per FTP hochladen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-allow true;
            set ftp:ssl-force false;
            set ssl:verify-certificate no;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:timeout 30;
            set ftp:use-mdtm false;
            set mirror:parallel-transfer-count 1;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror --reverse --delete --verbose --ignore-time \
                   --exclude-glob .ftp-deploy-sync-state.json \
                   ./out/ /public_html/;
          "
