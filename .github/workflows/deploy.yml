name: Auf maisonac.de veröffentlichen

# Läuft bei jeder Änderung am Arbeitszweig – und lässt sich im Reiter
# "Actions" auch von Hand auslösen.
on:
  push:
    branches: [claude/anna-blush-lashes-site-r13pxp]
  workflow_dispatch:

# Hostinger lässt nur wenige FTP-Verbindungen gleichzeitig zu. Zwei
# parallele Läufe blockieren sich gegenseitig, deshalb wird hier in
# Reihe gearbeitet.
concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pakete installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      # Der FTP-Zugang von Hostinger verweigert nach wenigen angelegten
      # Ordnern den Dienst. Deshalb geht die Seite als ein einziges Archiv
      # hinüber – zwei Dateien, kein einziger Ordner – und der Server packt
      # sie selbst aus.
      - name: Archiv schnüren
        run: |
          KENNWORT="$(openssl rand -hex 24)"
          echo "::add-mask::$KENNWORT"
          echo "KENNWORT=$KENNWORT" >> "$GITHUB_ENV"
          sed "s/__KENNWORT__/$KENNWORT/" tools/entpacken.php > out-entpacken.php
          (cd out && zip -qr ../seite.zip .)
          ls -lh seite.zip

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Archiv hochladen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set net:max-retries 5;
            set net:timeout 30;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            cd /public_html;
            put -O . seite.zip;
            put -O . -o entpacken.php out-entpacken.php;
          "

      - name: Auf dem Server entpacken
        run: |
          ANTWORT="$(curl -sS --max-time 180 "https://maisonac.de/entpacken.php?t=$KENNWORT")"
          echo "$ANTWORT"
          case "$ANTWORT" in
            OK*) echo "Veröffentlichung abgeschlossen." ;;
            *) echo "::error::Entpacken fehlgeschlagen: $ANTWORT"; exit 1 ;;
          esac
