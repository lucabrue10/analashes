# Holt die Set-Fotos aus dem Drive-Ordner "07_Website", wandelt sie von
# HEIC in JPEG, rechnet sie fuers Web klein und legt sie ins Projekt.
name: Set-Bilder einbauen

on:
  workflow_dispatch:

concurrency:
  group: set-bilder
  cancel-in-progress: false

jobs:
  bilder:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4
        with:
          ref: claude/anna-blush-lashes-site-r13pxp

      - name: Werkzeuge installieren
        run: |
          # pillow-heif bringt eine neuere HEIF-Bibliothek mit. Die von
          # Ubuntu stolpert ueber die Tiefenkarte, die iPhones in ihre
          # Aufnahmen legen.
          python3 -m pip install --quiet --break-system-packages pillow pillow-heif

      - name: Bilder holen und umrechnen
        run: |
          set -e
          mkdir -p public/galerie roh
          hole () {
            id="$1"; ziel="$2"
            curl -L --fail --retry 3 -o "roh/$ziel.bin" \
              "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            if [ "$(stat -c%s "roh/$ziel.bin")" -lt 20000 ]; then
              echo "Datei $ziel zu klein - vermutlich keine Freigabe:"; head -c 300 "roh/$ziel.bin"; exit 1
            fi
          }

          hole 119khwHK9O4TAuKh9LI1ZJNr0UxpKN5zT wispy-01
          hole 1Wl4SOY3t6TOAkeM5GpLNP6wFd-jaCvS6 soft-01
          hole 1IinEvWZGackL3iPmqaATFmZOyMzPF_Rf softvolumen-01
          hole 1K7zt0laS2q-M3kytXOkNVLsS7J5QHLWX wet-01
          hole 1Rd0ts5XAPEcoSVGWovyiykpAM2Y9v7Uq wet-02
          hole 11CCckRLkIHegBHisSZ1n8rPYWZlC6tL4 wet-03
          hole 1h3J7nn8niPL7m03DPJ5-1qxdQGmYpJZ0 wet-04
          hole 1DwHr9RF67cmGFmdzwEskaQpcQlD64QNm wetlook-01
          hole 1p_7KrNe_e-yGf1VPfhH2BauKDDNwzhQ- megavolumen-01
          hole 1NE_MVgZau9RKbAvrFVp2nfd3ancxhTw3 megavolumen-03
          hole 1YnItxpI2mXwaiyJXzk2qb-8pNCOT34KW megavolumen-04
          hole 1Y0EfBpPyUsaihjjFvnHy7ga9_pb7B-oK megavolumen-05

          python3 - <<'PYCODE'
          import pathlib
          from PIL import Image, ImageOps
          import pillow_heif

          pillow_heif.register_heif_opener()

          ziel = pathlib.Path("public/galerie")
          ziel.mkdir(parents=True, exist_ok=True)

          for quelle in sorted(pathlib.Path("roh").glob("*.bin")):
              bild = Image.open(quelle)
              bild = ImageOps.exif_transpose(bild).convert("RGB")
              bild.thumbnail((1400, 1400), Image.LANCZOS)
              datei = ziel / (quelle.stem + ".jpg")
              bild.save(datei, "JPEG", quality=82, optimize=True, progressive=True)
              print(datei.name, bild.width, "x", bild.height, datei.stat().st_size // 1024, "KB")
          PYCODE

          # Platzhalter von frueher, falls noch welche herumliegen.
          rm -f public/galerie/set-0*.jpg
          ls -lh public/galerie

      - name: Ins Projekt legen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/galerie
          git commit -m "Set-Fotos aus dem Drive eingebaut"
          git push origin HEAD:claude/anna-blush-lashes-site-r13pxp
